
 <div class="landing-page-container">
  <section class="info-side">
    <h1>Sell or Rent Property<br>Online Faster with AcchaSolution</h1>
    <ul>
      <li>✓ Verified Premium Buyers</li>
      <li>✓ Secure & Trusted Site Visits</li>
      <li>✓ Advanced Property Valuation</li>
    </ul>
    <img src="images/login image.png" alt="Property Illustration" class="hero-img">
  </section>

  <aside class="form-card">
    <h2 style="margin: 0 0 10px 0;">Start Your Journey</h2>
    <p style="color: #636e72; margin-bottom: 30px;">Fill the details below to list your property</p>
    
    <div class="input-group">
      <label>Property Intent</label>
      <select>
        <option>Sell</option>
        <option>Rent / Lease</option>
        <option>PG / Hostel</option>
      </select>
    </div>

    <div class="input-group">
      <label>Property Type</label>
      <select>
        <option>Residential Apartment</option>
        <option>Independent Villa</option>
        <option>Commercial Office</option>
      </select>
    </div>

<div class="input-group">
  <label for="email">Email Address</label>
  <input 
    type="email" 
    id="email" 
    [(ngModel)]="userEmail" 
    placeholder="tanubanglore35@gmail.com">
</div>

<button class="btn-start" (click)="onStartPosting()">Start Posting</button>
</aside>
</div>



<!-- OTP Modal -->
<div class="modal-overlay" *ngIf="showOtpModal">
  <div class="modal-content">
    <h2>Verify Email</h2>
    <p>Sent to: <strong>{{ userEmail }}</strong></p>
    
    <input 
      type="text" 
      [(ngModel)]="otpInput" 
      maxlength="6" 
      placeholder="000000" 
      class="otp-input"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"> <div class="timer-section">
      <p *ngIf="timer > 0">Resend OTP in {{ timer }}s</p>
      <button *ngIf="timer === 0" class="btn-cancel" (click)="resendOtp()">Resend OTP</button>
    </div>
    
    <!-- Aapke HTML file mein -->
<button class="btn-start" (click)="verifyOtp()" [disabled]="loading">
  {{ loading ? 'Verifying...' : 'Verify Now' }}
</button>
<!-- <button>Verify Now</button> -->
    <button class="btn-cancel" (click)="showOtpModal = false">Cancel</button>
  </div>
</div>
